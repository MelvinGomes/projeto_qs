<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro - Melvini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 25rem;">
        <h2 class="text-center mb-4">Criar Conta</h2>

        <div th:if="${param.error}" class="alert alert-danger text-center">Esse usuário já existe!</div>

        <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label class="form-label">Escolha um Usuário</label>
                <input type="text" th:field="*{username}" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Escolha uma Senha</label>
                <input type="password" th:field="*{password}" class="form-control" required minlength="4">
            </div>
            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/login}">Já tem conta? Fazer Login</a>
        </div>
    </div>
</body>
</html>
